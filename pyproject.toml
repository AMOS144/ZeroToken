[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zerotoken"
version = "2.0.0"
description = "ZeroToken - Record once, automate forever. A lightweight MCP for agent-driven browser automation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "playwright>=1.40.0",
    "pydantic>=2.5.0",
    "apscheduler>=3.10.4",
    "mcp[cli]>=1.0.0",
    "pillow>=12.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.10",
]

[dependency-groups]
dev = [
    "ruff>=0.15.10",
    "build>=1.4.0",
    "twine>=5.0.0",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.10",
]

[project.scripts]
zerotoken-mcp = "mcp_server:run"
zerotoken-mcp-http = "mcp_server_http:run"

[project.urls]
Homepage = "https://github.com/AMOS144/zerotoken"
Repository = "https://github.com/AMOS144/zerotoken"

[tool.setuptools.packages.find]
include = ["zerotoken*", "handlers*"]

[tool.setuptools]
py-modules = ["mcp_server", "mcp_server_http"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: E2E integration tests requiring real browser (deselect by default)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = true
