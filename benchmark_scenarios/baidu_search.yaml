name: "baidu_search"
description: "打开百度，搜索关键词，获取结果文本，截图，关闭"
tags: ["baidu", "search"]
timeout_seconds: 120

steps:
  - action: browser_init
    params:
      headless: false

  - action: browser_open
    params:
      url: "https://www.baidu.com"

  - action: browser_wait_for
    params:
      selector: "#kw"
      timeout: 10000

  - action: browser_input
    params:
      selector: "#kw"
      text: "ZeroToken MCP"

  - action: browser_click
    params:
      selector: "#su"

  - action: browser_wait_for
    params:
      selector: "#content_left"
      timeout: 10000

  - action: browser_get_text
    params:
      selector: "#content_left"
      include_screenshot: false

  - action: browser_screenshot
    params: {}

  - action: browser_close
    params: {}
